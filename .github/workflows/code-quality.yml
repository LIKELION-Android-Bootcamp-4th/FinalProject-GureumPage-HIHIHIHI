name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  detekt:
    name: detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Generate local.properties
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_CI }}
        run: |
          doppler secrets download \
            --no-file --format env \
            --token "$DOPPLER_TOKEN" \
            --project gureumpage --config ci \
            --exclude GOOGLE_SERVICES_JSON \
          | grep -E "^(KAKAO_|NAVER_|ALADIN_|GOOGLE_WEB_CLIENT_ID)" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Restore google-services.json
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_CI }}
        run: |
          doppler secrets get GOOGLE_SERVICES_JSON \
            --plain --token "$DOPPLER_TOKEN" \
            --project gureumpage --config ci \
            > app/google-services.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-reports
          path: build/reports/detekt/
          retention-days: 14
